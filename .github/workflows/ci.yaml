name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job in this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version in go.mod so CI and local runs agree.
  GO_VERSION: "1.23.12"
  # Declared, never inherited. `setup-go` v6+ exports this as `local`, but stating
  # it here keeps the guarantee independent of that action's major version, and it
  # is what makes a dependency requiring a newer Go fail loudly instead of
  # silently pulling a toolchain this repository never declares.
  GOTOOLCHAIN: "local"
  # Pinned to the version in the Makefile (see docs/adr/0001-adopt-enterprise-charter.md).
  GOLANGCI_VERSION: v2.14.0
  # x/vuln v1.2.0 and later require Go >= 1.25, and v1.8.0 requires Go >= 1.26;
  # this module is pinned to Go 1.23.12, so the scanner is the newest buildable release.
  GOVULN_VERSION: v1.1.4
  NODE_VERSION: "22"
  # Makes the shell-dependent tests fail rather than skip when their tool is
  # missing. internal/cli validates the generated completion scripts and manual
  # pages by handing them to bash, zsh and mandoc; those tests skip when a tool is
  # absent, which is right on a developer machine and wrong in CI, because a skip
  # is indistinguishable from a pass in a required status check. The `test` job
  # installs mandoc, so the roff validation cannot quietly stop running.
  # See requireTool in internal/cli/shelltools_test.go.
  #
  # The name must match requireShellToolsEnv in that file exactly; the two are
  # asserted against each other by TestRequireShellToolsEnvNameIsWired, because a
  # mismatch here would silently restore the skip it exists to prevent.
  KROOT_REQUIRE_SHELL_TOOLS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Correctness: formatting, vet, race tests with coverage, build.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux runs on every event; macOS is added only on a push to `main`.
      #
      # macOS runners bill at a 10x rate multiplier, and this account exhausted
      # its included Actions minutes (~12,400 billable-equivalent minutes per
      # month against a 3,000 per month allowance), at which point GitHub stopped
      # starting any job in this repository:
      #   "The job was not started because recent account payments have failed or
      #    your spending limit needs to be increased."
      # Verifying macOS on every push to every pull request was the largest single
      # cost driver for the least benefit: the platform is still verified, because
      # merging is a push, but it is verified once per merge instead of once per
      # commit. See docs/adr/0002-keep-macos-verification-off-pull-requests.md.
      #
      # The job name stays `test (ubuntu-latest)` on pull requests, so removing
      # `test (macos-latest)` from the required status checks is the only settings
      # change needed. A required check that a pull request never reports blocks
      # that pull request forever; the `commits` job below documents the same trap.
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # mandoc is the formatter macOS's own man uses, and it is what validates the
      # generated manual pages. It is not installed on ubuntu-latest by default, so
      # without this the roff lint and parse-tree tests would skip on every pull
      # request while the check list still reported them as covered.
      #
      # The package is pinned to the version Ubuntu ships rather than "latest", so
      # a formatter change cannot turn a passing page into a failing one, or the
      # reverse, without a visible change to this file.
      - name: Install mandoc
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mandoc
          # `command -v` rather than `mandoc -V`: the version flag is not
          # portable across mandoc builds — Ubuntu's 1.14.6 prints its usage and
          # exits 5 for `-V`, which reads as a broken install. Presence is all
          # that is being asserted, and the tests fail on their own if the tool is
          # unusable.
          command -v mandoc

      - name: Key build files are under version control
        run: |
          # A `Makefile` rule in a developer's global ignore file
          # (core.excludesFile, the qmake/Qt one) kept this repository's Makefile
          # untracked for the whole life of the repository, and nothing noticed
          # because this workflow never calls `make`. `--error-unmatch` fails when
          # the path is not tracked, which is the regression this guards.
          git ls-files --error-unmatch Makefile

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Formatting is deliberately not checked here. The `lint` job runs
      # golangci-lint, whose configured formatters are gofmt, gofumpt and
      # goimports (.golangci.yaml) — the set docs/enterprise/coding-standards.md
      # documents. A `gofmt -l .` step used to sit here as well, and because plain
      # gofmt accepts files that gofumpt rejects, the two "formatting" gates
      # disagreed about what formatted means. One tool defines it now.
      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build -trimpath -ldflags "-s -w" ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Static analysis.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  # ---------------------------------------------------------------------------
  # Known vulnerabilities in dependencies and in called standard library code.
  # ---------------------------------------------------------------------------
  vuln:
    name: vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULN_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  # ---------------------------------------------------------------------------
  # Commit message convention (Conventional Commits with a scope).
  #
  # This job always runs, and always reports success on the paths where linting
  # does not apply. That is deliberate: a job skipped by a job-level `if` leaves
  # its required status check expected forever, which blocks every pull request.
  # Reporting green from a no-op keeps the check usable as a required gate.
  #
  # Linting applies to pull requests only: a push has no base..head range to
  # inspect. Dependency bots are *not* exempt — their generated messages were
  # measured against commitlint and pass, so an exemption would only let a
  # malformed bot commit through unchallenged.
  # ---------------------------------------------------------------------------
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether commit linting applies
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: there is no base..head range to lint."
          else
            echo "applies=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.scope.outputs.applies == 'true'
        with:
          # commitlint needs both endpoints of the range.
          fetch-depth: 0

      # No `version` input on purpose: package.json declares packageManager, and
      # the action fails when both are present ("Multiple versions of pnpm
      # specified"). package.json stays the single source of truth.
      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.applies == 'true'

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.applies == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install tooling
        if: steps.scope.outputs.applies == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        if: steps.scope.outputs.applies == 'true'
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
