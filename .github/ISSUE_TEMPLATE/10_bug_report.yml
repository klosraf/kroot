name: Bug report
description: Something is broken or behaves unexpectedly.
title: "fix(scope): "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues must not be reported here.** Follow
        [SECURITY.md](https://github.com/kroot/kroot/blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `kroot version`
      placeholder: kroot 0.1.0 (commit 9a1d3f2, built 2026-09-26T19:00:00Z)
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture
      placeholder: macOS 15.0 arm64 / Ubuntu 24.04 amd64
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead. Include the full error output.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers the bug.
      placeholder: |
        1. Run `kroot ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, configuration (redacted), related issues.
    validations:
      required: false
